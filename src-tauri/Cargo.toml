[package]
name = "cedilha"
version = "0.1.0"
description = "A minimalist, distraction-free Markdown & LaTeX editor for the Omarchy aesthetic"
authors = ["Cedilha contributors"]
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rfd = "0.16"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
